# PurFacted 2.0 - production stack
# Only the app is exposed (APP_PORT); postgres and redis stay internal.
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-purfacted}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    # The app needs the full runtime config (APP_SECRET, SMTP_*, TURNSTILE_*,
    # ...) - pass .env through; the explicit entries below take precedence.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-purfacted}
      REDIS_URL: redis://redis:6379
      ORIGIN: ${ORIGIN:?set in .env, e.g. https://purfacted.com}
      # adapter-node: resolve the real client IP behind the central nginx
      # proxy, otherwise every per-IP rate limit keys on the proxy's address
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
