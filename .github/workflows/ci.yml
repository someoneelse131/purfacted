name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: purfacted
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: purfacted
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U purfacted"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://purfacted:devpassword@localhost:5432/purfacted
      TEST_DATABASE_URL: postgresql://purfacted:devpassword@localhost:5432/purfacted_test
      REDIS_URL: redis://localhost:6379
      # E2E flows read verification/reset mails from the dev mailbox endpoint
      EMAIL_DEV_MAILBOX: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit & integration tests
        run: npm run test

      - name: Prepare app database for E2E
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
